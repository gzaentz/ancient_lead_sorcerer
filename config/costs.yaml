# Provider cost configuration for Lead Sorcerer
# All costs are in USD per unit

coresignal:
  unit: 'lookup'
  usd_per_unit: 0.024

mailgun:
  unit: 'smtp_validation'
  usd_per_unit: 0.0005

snovio:
  unit: 'credit'
  usd_per_unit: 0.00553
  # Snov.io pricing:
  # - 1 credit per prospect search
  # - 1 credit per email found
  # - No charge for searches with zero results

company_enrich:
  unit: 'lookup'
  usd_per_unit: 0.001
  # CompanyEnrich pricing:
  # - $0.01 per company lookup
  # - $0.02 per contact lookup
  # - $0.015 per email lookup

anymail_finder:
  unit: 'call'
  usd_per_unit: 0.008
  # Anymail Finder pricing:
  # - $0.015 per contact lookup
  # - $0.012 per email lookup

hunter:
  unit: 'verification'
  usd_per_unit: 0.00836
  # Hunter.io pricing:
  # - $0.012 per email verification
  # - Rate limit: 10 requests per second

apollo:
  unit: 'credit'
  usd_per_unit: 0.01975
  # Apollo pricing:
  # - 1 credit per email
  # - 1 credit per enrichment
  # - Bulk operations may have different pricing

openrouter:
  unit: '1k_tokens'
  usd_per_unit: 0.00015

gse:
  unit: 'request'
  usd_per_unit: 0.005

firecrawl:
  unit: 'extract'
  usd_per_unit: 0.00067
